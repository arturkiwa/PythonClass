apiVersion: telemetry.istio.io/v1
kind: Telemetry
metadata:
  name: kafka-egress-metrics
  namespace: <twoj-ns>
spec:
  selector:
    matchLabels: {}  # albo np. app: twoja-apka
  metrics:
  - providers:
    - name: prometheus
    overrides:
    - match:
        metric: ALL_METRICS
      tagOverrides:
        destination_service:
          value: request.host
        destination_ip:
          value: connection.upstream.address
        destination_port:
          value: connection.upstream.port
    # Wymuś także TCP metrics (dla nie-HTTP to kluczowe)
    # W nowszym Istio TCP metryki są domyślnie włączone,
    # ale ten Telemetry zapewnia bogatsze tagi.




apiVersion: networking.istio.io/v1alpha3
kind: EnvoyFilter
metadata:
  name: sse-price-distribution-3000
  namespace: ptt-demo
spec:
  workloadSelector:
    labels:
      app: ptt-demo-price-distribution
  configPatches:
    - applyTo: HTTP_FILTER
      match:
        context: SIDECAR_INBOUND
        listener:
          portNumber: 3000
          filterChain:
            filter:
              name: envoy.filters.network.http_connection_manager
      patch:
        operation: INSERT_BEFORE
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
            inlineCode: |
              -- Prosty filter dla SSE: rozpoznaje Accept: text/event-stream
              -- i podbija time-out + wyłącza per-try timeout + kompresję.
              
              local SSE_TIMEOUT_MS = 3600000  -- 1h; jak chcesz więcej, podbij
              
              local function is_sse_request(headers)
                local accept = headers:get("accept") or ""
                if accept:lower():find("text/event%-stream", 1, true) ~= nil then
                  return true
                end
                return false
              end

              function envoy_on_request(handle)
                local headers = handle:headers()

                if not is_sse_request(headers) then
                  return
                end

                -- Podbij timeout upstream (override route timeout)
                -- 0 zwykle znaczy "bez limitu", ale dajemy konkretną dużą wartość.
                headers:replace("x-envoy-upstream-rq-timeout-ms", tostring(SSE_TIMEOUT_MS))

                -- Wyłącz per-try timeout (0 = brak per-try timeoutu)
                headers:replace("x-envoy-upstream-rq-per-try-timeout-ms", "0")

                -- Wyłącz kompresję po stronie Envoya dla SSE
                headers:replace("x-envoy-no-compression", "true")

                -- (opcjonalnie) tag do logów/metadanych:
                handle:logInfo("[SSE-FILTER] applied for request " ..
                  (headers:get(":path") or ""))
              end
